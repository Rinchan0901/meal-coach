<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ---------- CSS変数（utage-embedスコープ内） ---------- */
.utage-embed {
  --c-bg: #FBF7F2;
  --c-bg-soft: #F5EFE6;
  --c-paper: #FFFFFF;
  --c-text: #3A3530;
  --c-text-soft: #6B6358;
  --c-text-muted: #9A8F82;
  --c-accent: #C28E6E;
  --c-accent-deep: #A06F50;
  --c-accent-soft: #F2DFD1;
  --c-pink: #E8B7B0;
  --c-pink-soft: #FBE9E5;
  --c-mint: #A8C3B5;
  --c-mint-soft: #DCE8E1;
  --c-warn: #D9A441;
  --c-warn-soft: #FAF1DC;
  --c-line: #E8DFD2;
  --shadow-sm: 0 2px 8px rgba(120, 90, 70, 0.06);
  --shadow-md: 0 8px 24px rgba(120, 90, 70, 0.10);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;

  /* レイアウト・タイポグラフィの基準（body相当） */
  font-family: var(--font-jp);
  color: var(--c-text);
  background: var(--c-bg);
  line-height: 1.85;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt";
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.utage-embed * { box-sizing: border-box; }

/* ---------- セクション・見出し ---------- */
.utage-embed .section { margin-top: 24px; }

.utage-embed h2.chapter-title {
  font-family: var(--font-serif);
  font-size: 26px;
  line-height: 1.5;
  font-weight: 700;
  margin: 0 0 8px 0;
  color: var(--c-text);
  letter-spacing: 0.02em;
}

.utage-embed .chapter-num {
  display: inline-block;
  font-family: var(--font-serif);
  font-size: 13px;
  letter-spacing: 0.2em;
  color: var(--c-accent-deep);
  margin-bottom: 12px;
}

.utage-embed h3 {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  margin: 48px 0 16px 0;
  color: var(--c-text);
  padding-left: 14px;
  border-left: 3px solid var(--c-accent);
}

.utage-embed h4 {
  font-size: 16px;
  font-weight: 700;
  margin: 28px 0 10px 0;
  color: var(--c-accent-deep);
}

.utage-embed p { margin: 0 0 16px 0; color: var(--c-text); }

.utage-embed p.lead {
  font-size: 17px;
  color: var(--c-text-soft);
  line-height: 1.9;
  margin-bottom: 32px;
}

.utage-embed strong { color: var(--c-accent-deep); font-weight: 700; }
.utage-embed em {
  font-style: normal;
  background: linear-gradient(transparent 65%, var(--c-pink-soft) 65%);
  padding: 0 2px;
}

.utage-embed ul,
.utage-embed ol { margin: 12px 0 20px 24px; padding: 0; }
.utage-embed li { margin-bottom: 8px; line-height: 1.85; }
.utage-embed a { color: var(--c-accent-deep); }

/* ---------- Callout ---------- */
.utage-embed .callout {
  border-radius: var(--radius-md);
  padding: 24px 28px;
  margin: 28px 0;
  position: relative;
  border: 1px solid transparent;
}

.utage-embed .callout-label {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 12px;
}

.utage-embed .stuck { background: var(--c-pink-soft); border-color: #F0CFC8; }
.utage-embed .stuck .callout-label { background: var(--c-pink); color: #6B2A22; }
.utage-embed .stuck h4 { color: #8B3A2E; margin-top: 8px; font-size: 17px; }
.utage-embed .stuck .escape {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-top: 12px;
}
.utage-embed .stuck .escape::before {
  content: "🌿 抜け方";
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--c-mint);
  margin-bottom: 6px;
  letter-spacing: 0.1em;
}

.utage-embed .todo-box { background: var(--c-mint-soft); border-color: #C5D6CA; }
.utage-embed .todo-box .callout-label { background: var(--c-mint); color: #2F4A3D; }
.utage-embed .todo-box ul { list-style: none; margin-left: 0; padding: 0; }
.utage-embed .todo-box li { padding-left: 28px; position: relative; margin-bottom: 10px; }
.utage-embed .todo-box li::before {
  content: "☐";
  position: absolute;
  left: 0;
  top: 0;
  font-size: 18px;
  color: var(--c-mint);
  font-weight: 700;
}

.utage-embed .tip { background: var(--c-warn-soft); border-color: #F0DFAF; }
.utage-embed .tip .callout-label { background: var(--c-warn); color: #fff; }

.utage-embed .template {
  background: #F4F1EC;
  border: 1px dashed var(--c-text-muted);
}
.utage-embed .template .callout-label { background: var(--c-text-soft); color: #fff; }
.utage-embed .template pre {
  white-space: pre-wrap;
  font-family: var(--font-jp);
  font-size: 14px;
  line-height: 1.9;
  color: var(--c-text);
  padding: 12px 0 0;
  margin: 0;
}

.utage-embed .cheer {
  background: linear-gradient(135deg, #FBE9E5 0%, #F5EFE6 100%);
  border: 1px solid var(--c-pink);
  text-align: center;
  padding: 32px 28px;
  font-family: var(--font-serif);
  font-size: 16px;
  line-height: 2;
  color: var(--c-text);
}

/* ---------- Step list ---------- */
.utage-embed .steps {
  counter-reset: step;
  list-style: none;
  margin-left: 0;
  padding-left: 0;
}
.utage-embed .steps > li {
  counter-increment: step;
  background: var(--c-paper);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-md);
  padding: 24px 28px 24px 72px;
  margin-bottom: 16px;
  position: relative;
}
.utage-embed .steps > li::before {
  content: counter(step);
  position: absolute;
  left: 20px;
  top: 22px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--c-accent);
  color: #fff;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.utage-embed .steps > li > strong:first-child {
  display: block;
  font-size: 17px;
  margin-bottom: 6px;
  color: var(--c-text);
}

/* ---------- Tables ---------- */
.utage-embed table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 14px;
  background: var(--c-paper);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.utage-embed th,
.utage-embed td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid var(--c-line);
}
.utage-embed th {
  background: var(--c-bg-soft);
  font-weight: 700;
  font-size: 13px;
  color: var(--c-accent-deep);
  letter-spacing: 0.05em;
}
.utage-embed tr:last-child td { border-bottom: none; }

/* ---------- Misc ---------- */
.utage-embed .divider {
  border: none;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--c-line), transparent);
  margin: 56px 0;
}

.utage-embed .flow {
  background: var(--c-paper);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-md);
  padding: 28px;
  margin: 28px 0;
  text-align: center;
  font-family: var(--font-serif);
}
.utage-embed .flow-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.utage-embed .flow-node {
  background: var(--c-accent-soft);
  border: 2px solid var(--c-accent);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  font-weight: 700;
  font-size: 14px;
  color: var(--c-accent-deep);
  min-width: 110px;
}
.utage-embed .flow-arrow { color: var(--c-accent); font-size: 20px; }

/* ---------- Responsive ---------- */
@media (max-width: 600px) {
  .utage-embed { font-size: 15px; padding: 24px 16px 60px; }
  .utage-embed h2.chapter-title { font-size: 22px; }
  .utage-embed h3 { font-size: 18px; }
  .utage-embed .steps > li { padding: 22px 22px 22px 64px; }
  .utage-embed .steps > li::before { left: 16px; top: 22px; }
  .utage-embed .callout { padding: 20px 22px; }
}
</style>
